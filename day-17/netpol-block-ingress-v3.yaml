apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: block-ingress-from-namespace
  namespace: giropops
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - giropops
                  - ingress-nginx